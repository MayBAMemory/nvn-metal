# 卡比 iOS App 的工程描述（XcodeGen）。工程文件和 Gen/ 不进仓库，由 run.sh build 每次重新生成。
# 参照 dm/ios/project.yml（D2R），去掉了 D2R 的资源下载扩展、覆盖层、存档样本、UI 测试。
# Project description of Kirby's iOS App (XcodeGen). The project file and Gen/ are not committed; run.sh build regenerates them every time.
# Modelled on dm/ios/project.yml (D2R), without D2R's asset download extension, overlays, sample saves and UI tests.
name: KirbyIOS
options:
  bundleIdPrefix: ${KIRBY_BUNDLE_ID}
  deploymentTarget:
    iOS: "26.0"   # 图形层走 Metal 4（MTL4CommandQueue 等，iOS 26 起） | the graphics layer uses Metal 4 (MTL4CommandQueue etc., iOS 26+)
configFiles:      # run.sh build 生成：头文件路径、框架、内嵌段的链接参数 | generated by run.sh build: header paths, frameworks, link flags for the embedded segments
  Release: Gen/kirby.xcconfig
  Debug: Gen/kirby.xcconfig
targets:
  KirbyIOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Gen/src               # 宿主源文件（gen_build.py 从 kirby/host/Makefile 取） | host sources (gen_build.py takes them from kirby/host/Makefile)
      - path: Gen/main/kirby_main.c
        compilerFlags: "-Dmain=dm_main"
      - path: Gen/embed.S           # 改写后的 main / sdk / subsdk0 映像（dm/ios/tools/gen_embed.py） | rewritten main / sdk / subsdk0 images
      - path: Gen/dm                # 重定位表、门表、着色器映射表 | fixups, gates, shader map
        type: folder
        buildPhase: resources
      - path: Gen/msl               # iOS 版着色器库 b-<V>/（tools/shlib_ios.py） | iOS shader library b-<V>/
        type: folder
        buildPhase: resources
    dependencies:
      - sdk: UIKit.framework
      - sdk: CoreGraphics.framework
      - sdk: GameController.framework
    info:
      path: Gen/Info.plist
      properties:
        CFBundleDisplayName: Kirby Host
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchStoryboardName: ""
        UIFileSharingEnabled: true                # Finder / 「文件」App 能往 Documents 里拷 RomFS | Finder / Files can copy the RomFS into Documents
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        LSApplicationCategoryType: public.app-category.action-games
        LSSupportsGameMode: true
        GCSupportsControllerUserInteraction: true
        CADisableMinimumFrameDurationOnPhone: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ${KIRBY_BUNDLE_ID}
      DEVELOPMENT_TEAM: ${KIRBY_TEAM_ID}
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: Gen/kirby.entitlements   # run.sh 按账号类型写（免费账号签不了扩大内存的两项） | written by run.sh per account type (a free account cannot sign the two memory entitlements)
      TARGETED_DEVICE_FAMILY: "1,2"
      MARKETING_VERSION: "0.1"
      CURRENT_PROJECT_VERSION: $(KIRBY_BUILD_NUMBER)
      KIRBY_BUILD_NUMBER: "1"
      ENABLE_BITCODE: NO
      GCC_C_LANGUAGE_STANDARD: gnu11
      OTHER_CFLAGS: $(inherited) -mcpu=apple-a18 -Wno-unused-function   # 宿主汇编里有 LSE 原子指令，缺省基线不认；iPhone 16 Pro Max = A18 Pro | the host assembly uses LSE atomics, which the default baseline rejects
      CLANG_ENABLE_OBJC_ARC: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
